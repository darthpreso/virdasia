<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Virdasia — Anime &amp; Myth Inspired Small-Batch Outerwear</title>
    <meta name="description" content="Virdasia is a small-batch outerwear label drawing on anime, myth and fiction. Limited runs, made with care, shipped worldwide from Toronto. Join the waitlist for first access." />
    <meta name="author" content="Virdasia" />
    <meta name="theme-color" content="#2f5e5a" />
    <link rel="canonical" href="https://www.virdasia.com/" />

    <!-- Site verification. Pinterest checks for this tag on virdasia.com; it must
         stay in place after verifying, or the claim can be revoked. -->
    <meta name="p:domain_verify" content="dcac63918896af1703042bf5082a2421" />

    <!-- Icons -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <!-- Open Graph: how the link renders when shared to Instagram, Discord, iMessage, etc.
         URLs must be absolute — scrapers don't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virdasia" />
    <meta property="og:url" content="https://www.virdasia.com/" />
    <meta property="og:title" content="Virdasia" />
    <meta property="og:description" content="Wear the worlds you never left. Small-batch outerwear inspired by anime, myth and fiction. Limited runs, shipped worldwide. Join the waitlist for first access." />
    <meta property="og:image" content="https://www.virdasia.com/assets/og-image-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Virdasia — the &quot;Six Paths&quot; Sherpa Jacket in light purple with black artwork. Wear the worlds you never left." />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Virdasia" />
    <meta name="twitter:description" content="Wear the worlds you never left. Small-batch outerwear inspired by anime, myth and fiction. Limited runs, shipped worldwide." />
    <meta name="twitter:image" content="https://www.virdasia.com/assets/og-image-v2.jpg" />
    <meta name="twitter:image:alt" content="Virdasia — the &quot;Six Paths&quot; Sherpa Jacket in light purple with black artwork. Wear the worlds you never left." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;500;600;700&display=swap" />

    <!-- Organization data. sameAs is how Google ties the Instagram account to this
         brand rather than treating them as unrelated. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Virdasia",
        "url": "https://www.virdasia.com/",
        "logo": "https://www.virdasia.com/assets/virdasia-logo.png",
        "image": "https://www.virdasia.com/assets/og-image-v2.jpg",
        "description": "Small-batch outerwear label drawing on anime, myth and fiction. Limited runs, shipped worldwide from Toronto.",
        "email": "support@virdasia.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Toronto",
          "addressRegion": "ON",
          "addressCountry": "CA"
        },
        "sameAs": ["https://www.instagram.com/virdasiaclothing/"]
      }
    </script>
    <link rel="stylesheet" href="styles.css?v=153" />
  </head>
  <body>
    <div id="app"></div>
    <script src="supabase-config.js?v=2"></script>
    <!-- Pinned to an exact version with an integrity hash. Unpinned "@2" let the
         CDN serve whatever 2.x was current, and this script handles auth tokens —
         a bad build (or a compromised CDN) would have run with full page access.
         The browser now refuses to execute it unless the bytes match this hash.
         To upgrade: change the version AND regenerate the hash, or the script
         will be blocked. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"
            integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC"
            crossorigin="anonymous"></script>
    <script src="app.js?v=153"></script>
  </body>
